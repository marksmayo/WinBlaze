[package]
name = "winblaze-native"
version = "0.9.1"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "winblaze_native"
path = "src/lib.rs"

[dependencies]
winblaze-core = { path = "../WinBlaze.Core" }
winblaze-index = { path = "../WinBlaze.Index" }
winblaze-scanner = { path = "../WinBlaze.Scanner" }

[dev-dependencies]
serde_json = "1.0.151"

[[bin]]
name = "winblaze-cli"
path = "src/main.rs"
